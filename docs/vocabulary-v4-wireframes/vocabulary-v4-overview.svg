<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="2000" viewBox="0 0 1400 2000" role="img" aria-labelledby="title desc">
  <title id="title">Vocabulary V4 pure flashcards wireframe overview</title>
  <desc id="desc">Six minimal dark mobile screens for a pure vocabulary product: home, word sets, objective flashcard answer, answer feedback, create set sheet, and completion.</desc>
  <defs>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#ffd36b"/><stop offset="1" stop-color="#e5a42c"/></linearGradient>
    <linearGradient id="warm" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#d6ad72"/><stop offset="0.48" stop-color="#82604b"/><stop offset="1" stop-color="#26373d"/></linearGradient>
    <linearGradient id="paper" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#d7bea4"/><stop offset="0.55" stop-color="#7d9096"/><stop offset="1" stop-color="#3d4b54"/></linearGradient>
    <clipPath id="heroClip"><rect x="24" y="116" width="342" height="212" rx="24"/></clipPath>
    <clipPath id="flashClip"><rect x="24" y="178" width="342" height="306" rx="26"/></clipPath>
    <style>
      .phone{fill:#0b0c0e;stroke:#44464b;stroke-width:3}
      .surface{fill:#17191c;stroke:#2c2f34;stroke-width:1.5}
      .warmSurface{fill:#2a2115;stroke:#664c22;stroke-width:1.5}
      .cream{fill:#f8f5ed}
      .muted{fill:#999ba2}
      .faint{fill:#64666d}
      .goldText{fill:#f3ba45}
      .green{fill:#51c58a}
      .red{fill:#f0786b}
      .micro{font-family:Arial,sans-serif;font-size:10px}
      .body{font-family:Arial,sans-serif;font-size:13px}
      .bodyBold{font-family:Arial,sans-serif;font-size:13px;font-weight:700}
      .label{font-family:Arial,sans-serif;font-size:10px;font-weight:700;letter-spacing:1.3px}
      .title{font-family:Arial,sans-serif;font-size:25px;font-weight:700}
      .hero{font-family:Arial,sans-serif;font-size:28px;font-weight:700}
      .word{font-family:Arial,sans-serif;font-size:34px;font-weight:700}
      .center{text-anchor:middle}
    </style>
  </defs>

  <rect width="1400" height="2000" fill="#25272b"/>
  <text x="48" y="48" fill="#f8f5ed" font-family="Arial,sans-serif" font-size="25" font-weight="700">VOCABULARY V4 · PURE FLASHCARDS</text>
  <text x="1352" y="48" text-anchor="end" fill="#9a9ba1" font-family="Arial,sans-serif" font-size="13">fresh rebuild · 390 × 844 reference</text>
  <text x="48" y="77" fill="#9a9ba1" font-family="Arial,sans-serif" font-size="14">No self-grader. No other modalities. The app knows the answer.</text>

  <!-- 01 HOME -->
  <g transform="translate(50 105)">
    <rect class="phone" width="390" height="844" rx="34"/>
    <text x="24" y="30" class="cream micro">9:41</text><text x="366" y="30" text-anchor="end" class="cream micro">▮▮▮  ◉  82%</text>
    <text x="24" y="68" class="title cream">Vocabulary</text><text x="366" y="67" text-anchor="end" class="goldText" font-size="20">＋</text>
    <text x="24" y="92" class="body muted">Remember a few useful words.</text>

    <rect x="24" y="116" width="342" height="212" rx="24" fill="url(#warm)"/>
    <image href="../../landingpage/public/flashcard_bus_stop.png" x="24" y="116" width="342" height="212" preserveAspectRatio="xMidYMid slice" clip-path="url(#heroClip)" opacity=".45"/>
    <rect x="24" y="116" width="342" height="212" rx="24" fill="#0e1317" opacity=".42"/>
    <text x="46" y="151" class="label cream">TODAY’S WORDS</text>
    <text x="46" y="193" class="hero cream">5 flashcards</text>
    <text x="46" y="222" class="body cream">A short set from your French course.</text>
    <text x="46" y="252" class="body muted">≈ 5 minutes · images + audio ready</text>
    <rect x="46" y="273" width="151" height="35" rx="17" fill="url(#gold)"/><text x="121" y="296" class="bodyBold center" fill="#141517">Start flashcards  →</text>

    <text x="24" y="374" class="label goldText">YOUR WORDS</text>
    <text x="24" y="412" class="hero cream">184 learned</text><text x="366" y="412" text-anchor="end" class="body muted">12 to review</text>
    <rect x="24" y="432" width="342" height="1" fill="#2d3035"/>
    <text x="24" y="471" class="bodyBold cream">All word sets</text><text x="366" y="471" text-anchor="end" class="goldText" font-size="20">›</text>
    <rect x="24" y="505" width="342" height="1" fill="#2d3035"/>
    <text x="24" y="544" class="bodyBold cream">Create a set</text><text x="366" y="544" text-anchor="end" class="goldText" font-size="20">＋</text>
    <text x="24" y="607" class="label goldText">LAST SET</text>
    <text x="24" y="644" class="bodyBold cream">Morning routine</text><text x="366" y="644" text-anchor="end" class="micro green">3 / 5 correct</text>
    <text x="24" y="668" class="micro muted">A1 · 5 words · reviewed yesterday</text>

    <rect x="24" y="755" width="342" height="1" fill="#2d3035"/>
    <text x="57" y="792" class="goldText center" font-size="18">⌂</text><text x="57" y="816" class="micro goldText center">Home</text>
    <text x="195" y="792" class="muted center" font-size="18">▦</text><text x="195" y="816" class="micro muted center">Practice</text>
    <text x="333" y="792" class="muted center" font-size="18">◎</text><text x="333" y="816" class="micro muted center">Progress</text>
  </g>
  <text x="245" y="977" class="cream" font-family="Arial,sans-serif" font-size="16" font-weight="700">01 · HOME</text>
  <text x="245" y="998" class="muted" font-family="Arial,sans-serif" font-size="12">one review action</text>

  <!-- 02 SET LIST -->
  <g transform="translate(505 105)">
    <rect class="phone" width="390" height="844" rx="34"/>
    <text x="24" y="30" class="cream micro">9:41</text><text x="366" y="30" text-anchor="end" class="cream micro">▮▮▮  ◉  82%</text>
    <text x="24" y="68" class="cream" font-size="22">‹</text><text x="195" y="68" class="title cream center">Word sets</text>
    <text x="24" y="110" class="body muted">Choose a small set to practise.</text>
    <rect x="24" y="143" width="342" height="82" rx="20" class="warmSurface"/>
    <text x="46" y="174" class="label goldText">READY NOW</text><text x="46" y="204" class="bodyBold cream">Today’s words</text><text x="340" y="204" text-anchor="end" class="goldText" font-size="20">›</text>
    <text x="24" y="267" class="label goldText">ALL SETS</text>
    <text x="24" y="310" class="bodyBold cream">Morning routine</text><text x="366" y="310" text-anchor="end" class="micro green">3 / 5 ready</text><text x="24" y="332" class="micro muted">A1 · 5 words · reviewed yesterday</text>
    <rect x="24" y="351" width="342" height="1" fill="#2d3035"/>
    <text x="24" y="391" class="bodyBold cream">At the café</text><text x="366" y="391" text-anchor="end" class="micro goldText">2 / 7 ready</text><text x="24" y="413" class="micro muted">A1 · 7 words · new</text>
    <rect x="24" y="432" width="342" height="1" fill="#2d3035"/>
    <text x="24" y="472" class="bodyBold cream">Getting around</text><text x="366" y="472" text-anchor="end" class="micro faint">0 / 8 ready</text><text x="24" y="494" class="micro muted">A2 · 8 words · new</text>
    <rect x="24" y="513" width="342" height="1" fill="#2d3035"/>
    <text x="24" y="553" class="bodyBold cream">Saved words</text><text x="366" y="553" text-anchor="end" class="micro faint">12 words</text>
    <text x="24" y="617" class="label goldText">MORE</text>
    <text x="24" y="657" class="bodyBold cream">Create a new set</text><text x="366" y="657" text-anchor="end" class="goldText" font-size="20">＋</text>
    <text x="24" y="688" class="micro muted">Use a topic or a recent lesson.</text>
    <rect x="24" y="755" width="342" height="1" fill="#2d3035"/>
    <text x="57" y="792" class="muted center" font-size="18">⌂</text><text x="57" y="816" class="micro muted center">Home</text>
    <text x="195" y="792" class="goldText center" font-size="18">▦</text><text x="195" y="816" class="micro goldText center">Vocabulary</text>
    <text x="333" y="792" class="muted center" font-size="18">◎</text><text x="333" y="816" class="micro muted center">Progress</text>
  </g>
  <text x="700" y="977" class="cream" font-family="Arial,sans-serif" font-size="16" font-weight="700">02 · WORD SETS</text>
  <text x="700" y="998" class="muted" font-family="Arial,sans-serif" font-size="12">simple list, not a card maze</text>

  <!-- 03 QUESTION -->
  <g transform="translate(960 105)">
    <rect class="phone" width="390" height="844" rx="34"/>
    <text x="24" y="30" class="cream micro">9:41</text><text x="366" y="30" text-anchor="end" class="cream micro">▮▮▮  ◉  82%</text>
    <text x="24" y="68" class="cream" font-size="22">×</text><text x="195" y="68" class="bodyBold cream center">2 / 5</text><text x="366" y="68" text-anchor="end" class="goldText" font-size="18">⚙</text>
    <rect x="24" y="96" width="342" height="5" rx="3" fill="#2d3035"/><rect x="24" y="96" width="137" height="5" rx="3" fill="url(#gold)"/>
    <text x="195" y="145" class="micro muted center">Choose the French word</text>
    <rect x="24" y="178" width="342" height="306" rx="26" fill="url(#warm)"/>
    <image href="../../landingpage/public/flashcard_bus_stop.png" x="24" y="178" width="342" height="306" preserveAspectRatio="xMidYMid slice" clip-path="url(#flashClip)" opacity=".52"/>
    <rect x="24" y="178" width="342" height="306" rx="26" fill="#0d1317" opacity=".28"/>
    <text x="195" y="301" class="cream center" font-size="40">⌛</text>
    <text x="195" y="367" class="hero cream center">to wait</text>
    <text x="195" y="399" class="body cream center">A person waits for the bus.</text>
    <circle cx="330" cy="207" r="21" fill="#17191c" opacity=".86"/><text x="330" y="214" class="cream center" font-size="18">◖</text>
    <text x="24" y="536" class="label goldText">YOUR ANSWER</text>
    <rect x="24" y="557" width="342" height="58" rx="18" class="surface"/><text x="52" y="593" class="bodyBold cream">attendre</text><text x="340" y="593" text-anchor="end" class="goldText" font-size="18">›</text>
    <rect x="24" y="627" width="342" height="58" rx="18" class="surface"/><text x="52" y="663" class="bodyBold cream">arriver</text><text x="340" y="663" text-anchor="end" class="goldText" font-size="18">›</text>
    <rect x="24" y="697" width="342" height="58" rx="18" class="surface"/><text x="52" y="733" class="bodyBold cream">partir</text><text x="340" y="733" text-anchor="end" class="goldText" font-size="18">›</text>
    <text x="195" y="802" class="micro muted center">Tap an answer · the app checks it</text>
  </g>
  <text x="1155" y="977" class="cream" font-family="Arial,sans-serif" font-size="16" font-weight="700">03 · QUESTION</text>
  <text x="1155" y="998" class="muted" font-family="Arial,sans-serif" font-size="12">one prompt, three objective answers</text>

  <!-- 04 FEEDBACK -->
  <g transform="translate(50 1050)">
    <rect class="phone" width="390" height="844" rx="34"/>
    <text x="24" y="30" class="cream micro">9:41</text><text x="366" y="30" text-anchor="end" class="cream micro">▮▮▮  ◉  82%</text>
    <text x="24" y="68" class="cream" font-size="22">×</text><text x="195" y="68" class="bodyBold cream center">2 / 5</text><text x="366" y="68" text-anchor="end" class="goldText" font-size="18">⚙</text>
    <rect x="24" y="96" width="342" height="5" rx="3" fill="#2d3035"/><rect x="24" y="96" width="137" height="5" rx="3" fill="url(#gold)"/>
    <rect x="24" y="142" width="342" height="54" rx="18" fill="#153526" stroke="#397957"/><text x="50" y="176" class="green" font-size="20">✓</text><text x="84" y="176" class="bodyBold cream">Correct</text><text x="340" y="176" text-anchor="end" class="micro green">+ ready</text>
    <rect x="24" y="222" width="342" height="176" rx="24" class="surface"/>
    <text x="48" y="265" class="word cream">attendre</text><text x="340" y="265" text-anchor="end" class="goldText" font-size="20">◖</text>
    <text x="48" y="294" class="goldText bodyBold">/a.tɑ̃dʁ/</text><text x="48" y="328" class="body muted">to wait</text>
    <rect x="48" y="350" width="270" height="1" fill="#2d3035"/>
    <text x="48" y="380" class="bodyBold cream">J’attends le bus devant la gare.</text>
    <text x="24" y="445" class="label goldText">WHY IT STICKS</text>
    <text x="24" y="478" class="body muted">The image and sentence show the word in use.</text>
    <text x="24" y="507" class="body muted">It will return later through automatic review.</text>
    <rect x="24" y="611" width="342" height="58" rx="18" fill="url(#gold)"/><text x="195" y="646" class="bodyBold center" fill="#141517">Next word  →</text>
    <text x="195" y="715" class="micro muted center">No self-grade. No extra choice.</text>
    <text x="195" y="753" class="micro muted center">Wrong answers use the same feedback pattern.</text>
  </g>
  <text x="245" y="1922" class="cream" font-family="Arial,sans-serif" font-size="16" font-weight="700">04 · FEEDBACK</text>
  <text x="245" y="1943" class="muted" font-family="Arial,sans-serif" font-size="12">automatic result, one next button</text>

  <!-- 05 CREATE SET -->
  <g transform="translate(505 1050)">
    <rect class="phone" width="390" height="844" rx="34"/>
    <text x="24" y="30" class="cream micro">9:41</text><text x="366" y="30" text-anchor="end" class="cream micro">▮▮▮  ◉  82%</text>
    <rect x="0" y="325" width="390" height="519" rx="30" fill="#17191c" stroke="#44464b" stroke-width="2"/>
    <rect x="170" y="344" width="50" height="5" rx="3" fill="#686a70"/>
    <text x="195" y="398" class="title cream center">Create a set</text>
    <text x="195" y="431" class="body muted center">Make a small set for one topic.</text>
    <text x="24" y="487" class="label goldText">TOPIC</text>
    <rect x="24" y="503" width="342" height="60" rx="16" class="surface"/>
    <text x="46" y="540" class="body muted">e.g. morning routine</text>
    <text x="24" y="605" class="label goldText">OPTIONAL CONTEXT</text>
    <rect x="24" y="621" width="342" height="60" rx="16" class="surface"/>
    <text x="46" y="658" class="body muted">e.g. greeting someone at home</text>
    <text x="24" y="722" class="micro muted">Words, images, examples, and audio are prepared</text><text x="24" y="741" class="micro muted">before the set opens.</text>
    <rect x="24" y="771" width="342" height="53" rx="18" fill="url(#gold)"/><text x="195" y="804" class="bodyBold center" fill="#141517">Create set  ✦</text>
    <text x="195" y="283" class="body muted center">Presented as a scoped sheet.</text>
  </g>
  <text x="700" y="1922" class="cream" font-family="Arial,sans-serif" font-size="16" font-weight="700">05 · CREATE SET</text>
  <text x="700" y="1943" class="muted" font-family="Arial,sans-serif" font-size="12">optional, one field + one action</text>

  <!-- 06 COMPLETE -->
  <g transform="translate(960 1050)">
    <rect class="phone" width="390" height="844" rx="34"/>
    <text x="24" y="30" class="cream micro">9:41</text><text x="366" y="30" text-anchor="end" class="cream micro">▮▮▮  ◉  82%</text>
    <text x="24" y="68" class="cream" font-size="22">×</text><text x="195" y="68" class="title cream center">Finished</text>
    <text x="195" y="145" class="hero cream center">5 words completed</text>
    <text x="195" y="176" class="body muted center">Your answers are saved.</text>
    <rect x="44" y="215" width="302" height="10" rx="5" fill="#2d3035"/><rect x="44" y="215" width="181" height="10" rx="5" fill="url(#gold)"/>
    <text x="24" y="286" class="label goldText">RESULT</text>
    <text x="24" y="326" class="bodyBold cream">3 correct</text><text x="366" y="326" text-anchor="end" class="micro green">ready</text>
    <rect x="24" y="345" width="342" height="1" fill="#2d3035"/>
    <text x="24" y="385" class="bodyBold cream">2 to review</text><text x="366" y="385" text-anchor="end" class="micro goldText">soon</text>
    <text x="24" y="444" class="label goldText">REVIEW AGAIN</text>
    <text x="24" y="484" class="bodyBold cream">addition</text><text x="366" y="484" text-anchor="end" class="micro goldText">in 10 min</text>
    <rect x="24" y="503" width="342" height="1" fill="#2d3035"/>
    <text x="24" y="543" class="bodyBold cream">serveur</text><text x="366" y="543" text-anchor="end" class="micro goldText">later today</text>
    <rect x="24" y="629" width="342" height="58" rx="18" fill="url(#gold)"/><text x="195" y="664" class="bodyBold center" fill="#141517">Review mistakes  →</text>
    <text x="195" y="733" class="bodyBold goldText center">Done</text>
    <text x="195" y="792" class="micro muted center">No streak pressure. Just the next useful pass.</text>
  </g>
  <text x="1155" y="1922" class="cream" font-family="Arial,sans-serif" font-size="16" font-weight="700">06 · COMPLETE</text>
  <text x="1155" y="1943" class="muted" font-family="Arial,sans-serif" font-size="12">plain result, one next action</text>
</svg>
