<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Roleplay grammar lesson proposal</title>
  <desc id="desc">Bounded roleplay grammar beat where the learner chooses a prepared reply instead of typing, with translated partner line, hint, cached audio, and tutor call.</desc>
  <rect width="1200" height="900" fill="#ebe7df"/>
  <text x="48" y="40" fill="#191612" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="1.4">GRAMMAR V2 · ROLEPLAY</text>
  <text x="1152" y="40" text-anchor="end" fill="#8a847b" font-family="Arial,sans-serif" font-size="14">proposal · choose a bounded reply</text>
  <g transform="translate(45 68)">
    <rect width="500" height="788" rx="30" fill="#f9f7f1" stroke="#d9d2c7" stroke-width="2"/>
    <text x="24" y="39" fill="#191612" font-family="Arial,sans-serif" font-size="18">×</text><text x="250" y="39" text-anchor="middle" fill="#191612" font-family="Arial,sans-serif" font-size="17" font-weight="700">At the café</text><text x="474" y="39" text-anchor="end" fill="#191612" font-family="Arial,sans-serif" font-size="13" font-weight="700">1 of 4</text><rect x="24" y="55" width="452" height="6" rx="3" fill="#e3ded4"/><rect x="24" y="55" width="113" height="6" rx="3" fill="#b9781a"/>
    <text x="24" y="103" fill="#b9781a" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">ROLEPLAY · PRESENT</text><text x="24" y="153" fill="#191612" font-family="Arial,sans-serif" font-size="32" font-weight="700">Choose your reply</text><text x="435" y="151" fill="#b9781a" font-family="Arial,sans-serif" font-size="22">☎</text>
    <rect x="24" y="186" width="452" height="96" rx="20" fill="#f3eadb" stroke="#d6b47d"/><text x="48" y="218" fill="#191612" font-family="Arial,sans-serif" font-size="15" font-weight="700">MARIE · Server</text><text x="48" y="245" fill="#191612" font-family="Arial,sans-serif" font-size="16">Vous désirez quoi ?</text><text x="48" y="269" fill="#858078" font-family="Arial,sans-serif" font-size="13">What would you like?</text><text x="440" y="244" text-anchor="end" fill="#b9781a" font-family="Arial,sans-serif" font-size="18">◖</text>
    <text x="24" y="324" fill="#b9781a" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">YOUR GOAL</text><text x="24" y="351" fill="#191612" font-family="Arial,sans-serif" font-size="16" font-weight="700">Order a coffee politely.</text>
    <text x="24" y="397" fill="#b9781a" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">CHOOSE A REPLY</text>
    <g font-family="Arial,sans-serif"><rect x="24" y="414" width="452" height="58" rx="16" fill="#fff0ce" stroke="#b9781a" stroke-width="2"/><text x="48" y="440" fill="#191612" font-size="15" font-weight="700">Je voudrais un café, s’il vous plaît.</text><text x="48" y="459" fill="#858078" font-size="11">I would like a coffee, please.</text><rect x="24" y="482" width="452" height="58" rx="16" fill="#ffffff" stroke="#dedbd5"/><text x="48" y="508" fill="#191612" font-size="15" font-weight="700">Je voudrais une gare.</text><text x="48" y="527" fill="#858078" font-size="11">I would like a station.</text><rect x="24" y="550" width="452" height="58" rx="16" fill="#ffffff" stroke="#dedbd5"/><text x="48" y="576" fill="#191612" font-size="15" font-weight="700">Je suis une maison.</text><text x="48" y="595" fill="#858078" font-size="11">I am a house.</text></g>
    <g font-family="Arial,sans-serif" font-size="13" font-weight="700"><rect x="24" y="638" width="134" height="44" rx="22" fill="#ffffff" stroke="#dedbd5"/><text x="91" y="665" text-anchor="middle" fill="#191612">◖  Listen</text><rect x="168" y="638" width="134" height="44" rx="22" fill="#ffffff" stroke="#dedbd5"/><text x="235" y="665" text-anchor="middle" fill="#191612">♧  Hint</text><rect x="312" y="638" width="164" height="44" rx="22" fill="#fff0ce" stroke="#b9781a"/><text x="394" y="665" text-anchor="middle" fill="#b9781a">文A  Translate</text></g>
    <rect x="24" y="713" width="452" height="52" rx="17" fill="#b9781a"/><text x="250" y="746" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Check reply</text>
  </g>
  <g transform="translate(595 105)">
    <text x="0" y="0" fill="#191612" font-family="Arial,sans-serif" font-size="18" font-weight="700">Bounded roleplay rules</text>
    <text x="0" y="34" fill="#858078" font-family="Arial,sans-serif" font-size="14">It feels like a conversation, but every beat is pre-generated.</text>
    <rect y="68" width="542" height="190" rx="20" fill="#f9f7f1" stroke="#d9d2c7"/><text x="22" y="101" fill="#b9781a" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">NO OPEN WRITING</text><text x="22" y="135" fill="#191612" font-family="Arial,sans-serif" font-size="14">Pick a prepared reply or phrase sequence.</text><text x="22" y="166" fill="#191612" font-family="Arial,sans-serif" font-size="14">Goal match is checked before grammar feedback.</text><text x="22" y="197" fill="#858078" font-family="Arial,sans-serif" font-size="13">Next partner line comes from this scene's saved script.</text><text x="22" y="228" fill="#858078" font-family="Arial,sans-serif" font-size="13">The tutor can explain the current beat without taking it over.</text>
    <rect y="290" width="542" height="170" rx="20" fill="#171719" stroke="#36363a"/><text x="22" y="322" fill="#f0b43a" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">DARK MODE MIRROR</text><text x="22" y="356" fill="#f5f4f1" font-family="Arial,sans-serif" font-size="14">Partner bubble, choice cards, and actions invert semantically.</text><text x="22" y="388" fill="#aaa8a3" font-family="Arial,sans-serif" font-size="13">Selected reply is gold; success remains green.</text><text x="22" y="420" fill="#aaa8a3" font-family="Arial,sans-serif" font-size="13">No new status card or elongated rectangle appears.</text>
  </g>
</svg>
