<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Grammar V2 home proposal</title>
  <desc id="desc">Light mode grammar home with tense filters, three practice modes, a featured lesson card, and a three-column square lesson grid.</desc>
  <rect width="1200" height="900" fill="#ebe7df"/>
  <text x="48" y="40" fill="#191612" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="1.4">GRAMMAR V2 · HOME</text>
  <text x="1152" y="40" text-anchor="end" fill="#8a847b" font-family="Arial,sans-serif" font-size="14">proposal · same square grid as Writing</text>
  <g transform="translate(44 68)">
    <rect width="504" height="788" rx="30" fill="#f9f7f1" stroke="#d9d2c7" stroke-width="2"/>
    <text x="25" y="40" fill="#191612" font-family="Arial,sans-serif" font-size="20">‹</text>
    <text x="252" y="40" text-anchor="middle" fill="#191612" font-family="Arial,sans-serif" font-size="18" font-weight="700">Grammar</text>
    <text x="474" y="40" text-anchor="end" fill="#b9781a" font-family="Arial,sans-serif" font-size="17">A1⌄</text>
    <text x="26" y="97" fill="#191612" font-family="Arial,sans-serif" font-size="34" font-weight="700">Build your grammar</text>
    <text x="26" y="125" fill="#858078" font-family="Arial,sans-serif" font-size="16">Start with one form, build the sentence, use it.</text>
    <rect x="26" y="151" width="452" height="38" rx="19" fill="#fff0ce" stroke="#b9781a"/>
    <text x="48" y="176" fill="#b9781a" font-family="Arial,sans-serif" font-size="13" font-weight="700">TENSE</text>
    <text x="123" y="176" fill="#191612" font-family="Arial,sans-serif" font-size="13" font-weight="700">Present</text>
    <text x="214" y="176" fill="#858078" font-family="Arial,sans-serif" font-size="13">Past</text>
    <text x="276" y="176" fill="#858078" font-family="Arial,sans-serif" font-size="13">Future</text>
    <text x="359" y="176" fill="#858078" font-family="Arial,sans-serif" font-size="13">Mixed</text>
    <text x="453" y="176" text-anchor="end" fill="#b9781a" font-family="Arial,sans-serif" font-size="13">⌄</text>
    <text x="26" y="220" fill="#b9781a" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">PRACTICE YOUR WAY</text>
    <g transform="translate(26 234)">
      <rect width="143" height="88" rx="18" fill="#ffffff" stroke="#b9781a" stroke-width="2"/>
      <text x="15" y="27" fill="#b9781a" font-family="Arial,sans-serif" font-size="20">Aa</text>
      <text x="15" y="55" fill="#191612" font-family="Arial,sans-serif" font-size="13" font-weight="700">Guided</text>
      <text x="15" y="73" fill="#858078" font-family="Arial,sans-serif" font-size="10">Choose a form</text>
      <rect x="153" width="143" height="88" rx="18" fill="#ffffff" stroke="#dedbd5"/>
      <text x="168" y="27" fill="#858078" font-family="Arial,sans-serif" font-size="19">☷</text>
      <text x="168" y="55" fill="#191612" font-family="Arial,sans-serif" font-size="13" font-weight="700">Complete</text>
      <text x="168" y="73" fill="#858078" font-family="Arial,sans-serif" font-size="10">Fill the blank</text>
      <rect x="306" width="146" height="88" rx="18" fill="#ffffff" stroke="#dedbd5"/>
      <text x="321" y="27" fill="#858078" font-family="Arial,sans-serif" font-size="19">◌</text>
      <text x="321" y="55" fill="#191612" font-family="Arial,sans-serif" font-size="13" font-weight="700">Roleplay</text>
      <text x="321" y="73" fill="#858078" font-family="Arial,sans-serif" font-size="10">Choose a reply</text>
    </g>
    <rect x="26" y="346" width="452" height="146" rx="22" fill="#f3eadb" stroke="#d6b47d"/>
    <text x="48" y="374" fill="#b9781a" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">NEXT GRAMMAR LESSON · PRESENT</text>
    <text x="48" y="408" fill="#191612" font-family="Arial,sans-serif" font-size="23" font-weight="700">Un or une?</text>
    <text x="48" y="433" fill="#858078" font-family="Arial,sans-serif" font-size="13">Choose the article that matches the noun.</text>
    <rect x="48" y="451" width="126" height="28" rx="14" fill="#b9781a"/>
    <text x="111" y="470" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="12" font-weight="700">Start lesson</text>
    <text x="452" y="428" text-anchor="end" fill="#b9781a" font-family="Arial,sans-serif" font-size="26">›</text>
    <text x="26" y="530" fill="#b9781a" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">A1 PRESENT · 5 LESSONS</text>
    <g transform="translate(26 547)">
      <g>
        <rect width="143" height="112" rx="18" fill="#ffffff" stroke="#b9781a" stroke-width="2"/>
        <text x="14" y="27" fill="#b9781a" font-family="Arial,sans-serif" font-size="18">Aa</text><text x="126" y="27" text-anchor="end" fill="#2f9366" font-family="Arial,sans-serif" font-size="16">✓</text>
        <text x="14" y="72" fill="#191612" font-family="Arial,sans-serif" font-size="12" font-weight="700">Un or une?</text><text x="14" y="91" fill="#858078" font-family="Arial,sans-serif" font-size="10">Articles</text>
      </g>
      <g transform="translate(154)">
        <rect width="143" height="112" rx="18" fill="#ffffff" stroke="#dedbd5"/><text x="14" y="27" fill="#b9781a" font-family="Arial,sans-serif" font-size="18">Aa</text><text x="14" y="72" fill="#191612" font-family="Arial,sans-serif" font-size="12" font-weight="700">Je suis…</text><text x="14" y="91" fill="#858078" font-family="Arial,sans-serif" font-size="10">Être · present</text>
      </g>
      <g transform="translate(308)">
        <rect width="144" height="112" rx="18" fill="#ffffff" stroke="#dedbd5"/><text x="14" y="27" fill="#b9781a" font-family="Arial,sans-serif" font-size="18">Aa</text><text x="14" y="72" fill="#191612" font-family="Arial,sans-serif" font-size="12" font-weight="700">J’ai…</text><text x="14" y="91" fill="#858078" font-family="Arial,sans-serif" font-size="10">Avoir · present</text>
      </g>
    </g>
  </g>
  <g transform="translate(594 105)">
    <text x="0" y="0" fill="#191612" font-family="Arial,sans-serif" font-size="18" font-weight="700">Home behavior</text>
    <text x="0" y="34" fill="#858078" font-family="Arial,sans-serif" font-size="14">One selected tense drives the featured card, grid, and generation context.</text>
    <rect y="64" width="544" height="150" rx="20" fill="#f9f7f1" stroke="#d9d2c7"/>
    <text x="22" y="94" fill="#b9781a" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">FILTER CONTRACT</text>
    <text x="22" y="124" fill="#191612" font-family="Arial,sans-serif" font-size="14">Present  ·  Past  ·  Future  ·  Conditional  ·  All</text>
    <text x="22" y="153" fill="#858078" font-family="Arial,sans-serif" font-size="13">Level remains visible in the app bar and every lesson card.</text>
    <text x="22" y="181" fill="#858078" font-family="Arial,sans-serif" font-size="13">Cards stay square and three across on the phone.</text>
    <rect y="240" width="544" height="170" rx="20" fill="#171719" stroke="#36363a"/>
    <text x="22" y="271" fill="#f0b43a" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">DARK MODE MIRROR</text>
    <text x="22" y="304" fill="#f5f4f1" font-family="Arial,sans-serif" font-size="14">Same geometry, order, and touch targets.</text>
    <text x="22" y="333" fill="#aaa8a3" font-family="Arial,sans-serif" font-size="13">Canvas / surface / ink roles switch through DesignTokens.</text>
    <text x="22" y="362" fill="#aaa8a3" font-family="Arial,sans-serif" font-size="13">Gold remains the selected state and primary action.</text>
  </g>
</svg>
