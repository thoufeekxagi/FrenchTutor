<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Complete grammar lesson proposal</title>
  <desc id="desc">Complete grammar exercise with a sentence blank, three translated choices, partner context, tutor phone, cached listen and hint actions.</desc>
  <rect width="1200" height="900" fill="#ebe7df"/>
  <text x="48" y="40" fill="#191612" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="1.4">GRAMMAR V2 · COMPLETE</text>
  <text x="1152" y="40" text-anchor="end" fill="#8a847b" font-family="Arial,sans-serif" font-size="14">proposal · choose the missing form</text>
  <g transform="translate(45 68)">
    <rect width="500" height="788" rx="30" fill="#f9f7f1" stroke="#d9d2c7" stroke-width="2"/>
    <text x="24" y="39" fill="#191612" font-family="Arial,sans-serif" font-size="18">×</text><text x="250" y="39" text-anchor="middle" fill="#191612" font-family="Arial,sans-serif" font-size="17" font-weight="700">Je suis…</text><text x="474" y="39" text-anchor="end" fill="#191612" font-family="Arial,sans-serif" font-size="13" font-weight="700">2 of 5</text><rect x="24" y="55" width="452" height="6" rx="3" fill="#e3ded4"/><rect x="24" y="55" width="180" height="6" rx="3" fill="#b9781a"/>
    <text x="24" y="103" fill="#b9781a" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">COMPLETE · PRESENT</text><text x="24" y="153" fill="#191612" font-family="Arial,sans-serif" font-size="32" font-weight="700">Choose the best form</text><text x="435" y="151" fill="#b9781a" font-family="Arial,sans-serif" font-size="22">☎</text>
    <rect x="24" y="190" width="452" height="66" rx="18" fill="#f3eadb" stroke="#d6b47d"/><text x="48" y="219" fill="#191612" font-family="Arial,sans-serif" font-size="15" font-weight="700">Marie</text><text x="48" y="242" fill="#858078" font-family="Arial,sans-serif" font-size="13">Tu es qui ?  ·  Who are you?</text><text x="442" y="231" text-anchor="end" fill="#b9781a" font-family="Arial,sans-serif" font-size="17">◖</text>
    <text x="250" y="302" text-anchor="middle" fill="#191612" font-family="Arial,sans-serif" font-size="24" font-weight="700">Je ___ étudiant.</text><text x="250" y="328" text-anchor="middle" fill="#858078" font-family="Arial,sans-serif" font-size="14">I am a student.</text>
    <g font-family="Arial,sans-serif"><rect x="24" y="368" width="452" height="68" rx="16" fill="#ffffff" stroke="#b9781a" stroke-width="2"/><text x="48" y="398" fill="#191612" font-size="17" font-weight="700">suis</text><text x="448" y="398" text-anchor="end" fill="#858078" font-size="12">I am</text><rect x="24" y="446" width="452" height="68" rx="16" fill="#ffffff" stroke="#dedbd5"/><text x="48" y="476" fill="#191612" font-size="17" font-weight="700">es</text><text x="448" y="476" text-anchor="end" fill="#858078" font-size="12">are</text><rect x="24" y="524" width="452" height="68" rx="16" fill="#ffffff" stroke="#dedbd5"/><text x="48" y="554" fill="#191612" font-size="17" font-weight="700">est</text><text x="448" y="554" text-anchor="end" fill="#858078" font-size="12">is</text></g>
    <g font-family="Arial,sans-serif" font-size="13" font-weight="700"><rect x="24" y="625" width="134" height="44" rx="22" fill="#ffffff" stroke="#dedbd5"/><text x="91" y="652" text-anchor="middle" fill="#191612">◖  Listen</text><rect x="168" y="625" width="134" height="44" rx="22" fill="#ffffff" stroke="#dedbd5"/><text x="235" y="652" text-anchor="middle" fill="#191612">♧  Hint</text><rect x="312" y="625" width="164" height="44" rx="22" fill="#fff0ce" stroke="#b9781a"/><text x="394" y="652" text-anchor="middle" fill="#b9781a">文A  Translate</text></g>
    <rect x="24" y="702" width="452" height="52" rx="17" fill="#b9781a"/><text x="250" y="735" text-anchor="middle" fill="#ffffff" font-family="Arial,sans-serif" font-size="15" font-weight="700">Check answer</text>
  </g>
  <g transform="translate(595 110)">
    <text x="0" y="0" fill="#191612" font-family="Arial,sans-serif" font-size="18" font-weight="700">Complete state rules</text>
    <text x="0" y="34" fill="#858078" font-family="Arial,sans-serif" font-size="14">The missing form is always evaluated from the frozen lesson.</text>
    <rect y="68" width="542" height="174" rx="20" fill="#f9f7f1" stroke="#d9d2c7"/><text x="22" y="100" fill="#b9781a" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">AFTER CHECK</text><text x="22" y="134" fill="#191612" font-family="Arial,sans-serif" font-size="14">Correct: show one short rule, then Next.</text><text x="22" y="165" fill="#191612" font-family="Arial,sans-serif" font-size="14">Wrong: keep all choices and explain the contrast.</text><text x="22" y="202" fill="#858078" font-family="Arial,sans-serif" font-size="13">No LLM grading is needed for a closed choice.</text>
    <rect y="272" width="542" height="168" rx="20" fill="#171719" stroke="#36363a"/><text x="22" y="304" fill="#f0b43a" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">DARK MODE MIRROR</text><text x="22" y="338" fill="#f5f4f1" font-family="Arial,sans-serif" font-size="14">Choice cards invert to surface/ink roles.</text><text x="22" y="370" fill="#aaa8a3" font-family="Arial,sans-serif" font-size="13">Translation stays inside each choice, not in the blank.</text><text x="22" y="402" fill="#aaa8a3" font-family="Arial,sans-serif" font-size="13">Phone, Listen, Hint, and Translate stay in the same row.</text>
  </g>
</svg>
