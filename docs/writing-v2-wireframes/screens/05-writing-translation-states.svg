<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Writing translation states</title>
  <desc id="desc">Three light-mode Writing lesson wireframes showing the Speaking-style Translation on control for Guided, Complete, and Roleplay.</desc>
  <rect width="1200" height="900" fill="#ece8df"/>
  <text x="48" y="42" fill="#181410" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.2">WRITING · TRANSLATION ON</text>
  <text x="1152" y="42" text-anchor="end" fill="#8b867e" font-family="Arial, sans-serif" font-size="14">Light-mode review wireframe</text>

  <!-- Guided -->
  <g transform="translate(35 70)">
    <rect width="350" height="780" rx="28" fill="#f9f7f1" stroke="#d9d2c7" stroke-width="2"/>
    <text x="20" y="34" fill="#181410" font-family="Arial, sans-serif" font-size="12">×</text>
    <text x="175" y="34" text-anchor="middle" fill="#181410" font-family="Arial, sans-serif" font-size="15" font-weight="700">Introduce yourself</text>
    <text x="326" y="34" text-anchor="end" fill="#181410" font-family="Arial, sans-serif" font-size="12" font-weight="700">1 of 5</text>
    <rect x="20" y="48" width="310" height="5" rx="3" fill="#e3ded4"/>
    <rect x="20" y="48" width="62" height="5" rx="3" fill="#c07b1d"/>
    <text x="20" y="92" fill="#c07b1d" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">GUIDED</text>
    <text x="20" y="128" fill="#181410" font-family="Arial, sans-serif" font-size="26" font-weight="700">Build the sentence</text>
    <text x="20" y="153" fill="#8b867e" font-family="Arial, sans-serif" font-size="14">Hello, my name is Alex.</text>
    <rect x="20" y="178" width="310" height="132" rx="18" fill="#ffffff" stroke="#c07b1d" stroke-width="2"/>
    <text x="302" y="203" text-anchor="end" fill="#c07b1d" font-family="Arial, sans-serif" font-size="19">◖</text>
    <rect x="38" y="232" width="82" height="34" rx="13" fill="#fff0ce"/>
    <rect x="128" y="232" width="42" height="34" rx="13" fill="#fff0ce"/>
    <rect x="178" y="232" width="55" height="34" rx="13" fill="#fff0ce"/>
    <text x="79" y="254" text-anchor="middle" fill="#181410" font-family="Arial, sans-serif" font-size="13" font-weight="700">Bonjour,</text>
    <text x="149" y="254" text-anchor="middle" fill="#181410" font-family="Arial, sans-serif" font-size="13" font-weight="700">je</text>
    <text x="205" y="254" text-anchor="middle" fill="#181410" font-family="Arial, sans-serif" font-size="13" font-weight="700">m’appelle</text>
    <text x="20" y="346" fill="#c07b1d" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">WORD BANK</text>
    <g font-family="Arial, sans-serif">
      <rect x="20" y="360" width="88" height="53" rx="13" fill="#ffffff" stroke="#ddd8d0"/>
      <text x="64" y="383" text-anchor="middle" fill="#181410" font-size="13" font-weight="700">Alex.</text><text x="64" y="400" text-anchor="middle" fill="#8b867e" font-size="10">(Alex)</text>
      <rect x="116" y="360" width="72" height="53" rx="13" fill="#ffffff" stroke="#ddd8d0"/>
      <text x="152" y="383" text-anchor="middle" fill="#181410" font-size="13" font-weight="700">Bonjour,</text><text x="152" y="400" text-anchor="middle" fill="#8b867e" font-size="10">(hello)</text>
      <rect x="196" y="360" width="52" height="53" rx="13" fill="#ffffff" stroke="#ddd8d0"/>
      <text x="222" y="383" text-anchor="middle" fill="#181410" font-size="13" font-weight="700">je</text><text x="222" y="400" text-anchor="middle" fill="#8b867e" font-size="10">(I)</text>
      <rect x="256" y="360" width="74" height="53" rx="13" fill="#ffffff" stroke="#ddd8d0"/>
      <text x="293" y="383" text-anchor="middle" fill="#181410" font-size="13" font-weight="700">m’appelle</text><text x="293" y="400" text-anchor="middle" fill="#8b867e" font-size="10">(my name is)</text>
    </g>
    <text x="20" y="438" fill="#8b867e" font-family="Arial, sans-serif" font-size="12">Shuffled bank · selected answer stays French-only</text>
    <rect x="20" y="694" width="124" height="42" rx="21" fill="#ffffff" stroke="#c07b1d" stroke-width="1.5"/>
    <text x="82" y="720" text-anchor="middle" fill="#c07b1d" font-family="Arial, sans-serif" font-size="12" font-weight="700">⌕ Translation on</text>
    <rect x="152" y="694" width="178" height="42" rx="14" fill="#c07b1d"/>
    <text x="241" y="720" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Check sentence</text>
  </g>

  <!-- Complete -->
  <g transform="translate(425 70)">
    <rect width="350" height="780" rx="28" fill="#f9f7f1" stroke="#d9d2c7" stroke-width="2"/>
    <text x="20" y="34" fill="#181410" font-family="Arial, sans-serif" font-size="12">×</text>
    <text x="175" y="34" text-anchor="middle" fill="#181410" font-family="Arial, sans-serif" font-size="15" font-weight="700">Order a coffee</text>
    <text x="326" y="34" text-anchor="end" fill="#181410" font-family="Arial, sans-serif" font-size="12" font-weight="700">1 of 5</text>
    <rect x="20" y="48" width="310" height="5" rx="3" fill="#e3ded4"/>
    <rect x="20" y="48" width="62" height="5" rx="3" fill="#c07b1d"/>
    <text x="20" y="92" fill="#c07b1d" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="2">COMPLETE</text>
    <text x="20" y="128" fill="#181410" font-family="Arial, sans-serif" font-size="26" font-weight="700">Choose the best word</text>
    <text x="20" y="169" fill="#c07b1d" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">MARIE</text>
    <rect x="20" y="178" width="310" height="54" rx="16" fill="#ffffff" stroke="#ddd8d0"/>
    <text x="34" y="201" fill="#181410" font-family="Arial, sans-serif" font-size="13">Tu veux boire quoi ?</text><text x="34" y="219" fill="#8b867e" font-family="Arial, sans-serif" font-size="10">(What do you want to drink?)</text>
    <rect x="20" y="254" width="310" height="96" rx="18" fill="#ffffff" stroke="#ddd8d0"/>
    <text x="175" y="292" text-anchor="middle" fill="#181410" font-family="Arial, sans-serif" font-size="18" font-weight="700">Je voudrais ___</text>
    <text x="175" y="316" text-anchor="middle" fill="#8b867e" font-family="Arial, sans-serif" font-size="13">(I would like ___)</text>
    <g font-family="Arial, sans-serif">
      <rect x="20" y="370" width="310" height="60" rx="16" fill="#fff0ce" stroke="#c07b1d"/>
      <text x="54" y="397" fill="#c07b1d" font-size="16">●</text><text x="75" y="396" fill="#181410" font-size="15" font-weight="700">un café</text><text x="75" y="415" fill="#8b867e" font-size="11">(a coffee)</text>
      <rect x="20" y="440" width="310" height="60" rx="16" fill="#ffffff" stroke="#ddd8d0"/>
      <text x="54" y="467" fill="#8b867e" font-size="16">○</text><text x="75" y="466" fill="#181410" font-size="15" font-weight="700">une gare</text><text x="75" y="485" fill="#8b867e" font-size="11">(a station)</text>
      <rect x="20" y="510" width="310" height="60" rx="16" fill="#ffffff" stroke="#ddd8d0"/>
      <text x="54" y="537" fill="#8b867e" font-size="16">○</text><text x="75" y="536" fill="#181410" font-size="15" font-weight="700">un ami</text><text x="75" y="555" fill="#8b867e" font-size="11">(a friend)</text>
    </g>
    <rect x="20" y="694" width="124" height="42" rx="21" fill="#ffffff" stroke="#c07b1d" stroke-width="1.5"/>
    <text x="82" y="720" text-anchor="middle" fill="#c07b1d" font-family="Arial, sans-serif" font-size="12" font-weight="700">⌕ Translation on</text>
    <rect x="152" y="694" width="178" height="42" rx="14" fill="#c07b1d"/>
    <text x="241" y="720" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Check answer</text>
  </g>

  <!-- Roleplay -->
  <g transform="translate(815 70)">
    <rect width="350" height="780" rx="28" fill="#f9f7f1" stroke="#d9d2c7" stroke-width="2"/>
    <text x="20" y="34" fill="#181410" font-family="Arial, sans-serif" font-size="12">×</text>
    <text x="175" y="34" text-anchor="middle" fill="#181410" font-family="Arial, sans-serif" font-size="15" font-weight="700">At the café</text>
    <text x="326" y="34" text-anchor="end" fill="#181410" font-family="Arial, sans-serif" font-size="12" font-weight="700">1 of 4</text>
    <rect x="20" y="48" width="310" height="5" rx="3" fill="#e3ded4"/>
    <rect x="20" y="48" width="78" height="5" rx="3" fill="#c07b1d"/>
    <rect x="20" y="82" width="310" height="44" rx="14" fill="#ffffff" stroke="#c07b1d"/>
    <text x="98" y="101" text-anchor="middle" fill="#c07b1d" font-family="Arial, sans-serif" font-size="10" font-weight="700">YOU · LEARNER</text>
    <line x1="175" y1="92" x2="175" y2="116" stroke="#ddd8d0"/>
    <text x="252" y="101" text-anchor="middle" fill="#c07b1d" font-family="Arial, sans-serif" font-size="10" font-weight="700">MARIE · PARTNER</text>
    <text x="20" y="160" fill="#c07b1d" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">MARIE</text>
    <rect x="20" y="168" width="310" height="72" rx="17" fill="#ffffff" stroke="#ddd8d0"/>
    <text x="34" y="193" fill="#181410" font-family="Arial, sans-serif" font-size="13">Bonjour ! Vous désirez ?</text><text x="34" y="214" fill="#8b867e" font-family="Arial, sans-serif" font-size="10">(Hello! What would you like?)</text>
    <rect x="20" y="264" width="310" height="82" rx="17" fill="#fff0ce" stroke="#c07b1d"/>
    <text x="34" y="288" fill="#c07b1d" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.2">YOUR GOAL</text>
    <text x="34" y="312" fill="#181410" font-family="Arial, sans-serif" font-size="13">Reply politely and order a coffee.</text>
    <text x="20" y="382" fill="#c07b1d" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.4">SUGGESTIONS</text>
    <rect x="20" y="396" width="122" height="53" rx="13" fill="#ffffff" stroke="#ddd8d0"/><text x="81" y="419" text-anchor="middle" fill="#181410" font-family="Arial, sans-serif" font-size="12" font-weight="700">un café</text><text x="81" y="437" text-anchor="middle" fill="#8b867e" font-family="Arial, sans-serif" font-size="10">(a coffee)</text>
    <rect x="150" y="396" width="164" height="53" rx="13" fill="#ffffff" stroke="#ddd8d0"/><text x="232" y="419" text-anchor="middle" fill="#181410" font-family="Arial, sans-serif" font-size="12" font-weight="700">s’il vous plaît</text><text x="232" y="437" text-anchor="middle" fill="#8b867e" font-family="Arial, sans-serif" font-size="10">(please)</text>
    <rect x="20" y="470" width="310" height="90" rx="17" fill="#ffffff" stroke="#ddd8d0"/>
    <text x="34" y="497" fill="#8b867e" font-family="Arial, sans-serif" font-size="13">Write a short reply in French…</text>
    <text x="34" y="520" fill="#8b867e" font-family="Arial, sans-serif" font-size="10">Suggestions stay below the editor</text>
    <rect x="20" y="694" width="124" height="42" rx="21" fill="#ffffff" stroke="#c07b1d" stroke-width="1.5"/>
    <text x="82" y="720" text-anchor="middle" fill="#c07b1d" font-family="Arial, sans-serif" font-size="12" font-weight="700">⌕ Translation on</text>
    <rect x="152" y="694" width="178" height="42" rx="14" fill="#c07b1d"/>
    <text x="241" y="720" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="13" font-weight="700">Send reply</text>
  </g>
</svg>
