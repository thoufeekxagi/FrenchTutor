<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Writing home square lesson grid</title>
  <desc id="desc">Light-mode Writing home wireframe with three square lesson cards per row, matching the Speaking course grid.</desc>
  <rect width="390" height="844" rx="28" fill="#f9f7f1"/>
  <g font-family="Arial, sans-serif">
    <text x="20" y="39" fill="#181410" font-size="22">‹</text>
    <text x="195" y="38" text-anchor="middle" fill="#181410" font-size="19" font-weight="700">Writing</text>
    <text x="370" y="39" text-anchor="end" fill="#c07b1d" font-size="18">⋮</text>
    <text x="20" y="88" fill="#181410" font-size="29" font-weight="700">Build confidence to write</text>
    <text x="20" y="113" fill="#8b867e" font-size="13">Choose a lesson, write in French, and improve one step at a time.</text>
    <rect x="20" y="133" width="54" height="34" rx="17" fill="#fff0ce" stroke="#c07b1d" stroke-width="1.5"/>
    <text x="47" y="155" text-anchor="middle" fill="#c07b1d" font-size="13" font-weight="700">A1</text>
    <text x="86" y="155" fill="#8b867e" font-size="12">5 lessons ready · 0 complete</text>
    <rect x="20" y="185" width="350" height="52" rx="17" fill="#ffffff" stroke="#ddd8d0"/>
    <rect x="24" y="189" width="108" height="44" rx="14" fill="#c07b1d"/>
    <text x="78" y="220" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">✎ Guided</text>
    <text x="193" y="220" text-anchor="middle" fill="#8b867e" font-size="12" font-weight="700">☑ Complete</text>
    <text x="307" y="220" text-anchor="middle" fill="#8b867e" font-size="12" font-weight="700">◌ Roleplay</text>
    <text x="20" y="270" fill="#c07b1d" font-size="11" font-weight="700" letter-spacing="1.8">NEXT GUIDED LESSON</text>
    <rect x="20" y="282" width="350" height="116" rx="20" fill="#ffffff" stroke="#c07b1d" stroke-width="1.5"/>
    <text x="38" y="311" fill="#c07b1d" font-size="11" font-weight="700" letter-spacing="1.3">ORDER A COFFEE</text>
    <text x="38" y="338" fill="#181410" font-size="18" font-weight="700">Build one useful café sentence.</text>
    <text x="38" y="363" fill="#8b867e" font-size="12">A1 · 5 writing steps</text>
    <rect x="253" y="330" width="97" height="42" rx="14" fill="#c07b1d"/>
    <text x="301" y="356" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="700">Start writing</text>
    <text x="20" y="432" fill="#c07b1d" font-size="11" font-weight="700" letter-spacing="1.8">GUIDED LESSONS</text>

    <!-- row one -->
    <g transform="translate(20 447)">
      <rect width="108" height="108" rx="17" fill="#fff0ce" stroke="#c07b1d" stroke-width="1.5"/>
      <text x="12" y="25" fill="#c07b1d" font-size="20">✎</text>
      <text x="12" y="73" fill="#181410" font-size="12" font-weight="700">Introduce</text><text x="12" y="88" fill="#181410" font-size="12" font-weight="700">yourself</text>
      <text x="12" y="102" fill="#8b867e" font-size="9">A1 · 5 steps</text>
    </g>
    <g transform="translate(141 447)">
      <rect width="108" height="108" rx="17" fill="#ffffff" stroke="#ddd8d0"/>
      <text x="12" y="25" fill="#c07b1d" font-size="20">☕</text>
      <text x="12" y="73" fill="#181410" font-size="12" font-weight="700">Order a</text><text x="12" y="88" fill="#181410" font-size="12" font-weight="700">coffee</text>
      <text x="12" y="102" fill="#8b867e" font-size="9">A1 · 5 steps</text>
    </g>
    <g transform="translate(262 447)">
      <rect width="108" height="108" rx="17" fill="#ffffff" stroke="#ddd8d0"/>
      <text x="12" y="25" fill="#c07b1d" font-size="20">?</text>
      <text x="12" y="73" fill="#181410" font-size="12" font-weight="700">Ask for</text><text x="12" y="88" fill="#181410" font-size="12" font-weight="700">help</text>
      <text x="12" y="102" fill="#8b867e" font-size="9">A1 · 5 steps</text>
    </g>
    <!-- row two -->
    <g transform="translate(20 568)">
      <rect width="108" height="108" rx="17" fill="#ffffff" stroke="#ddd8d0"/>
      <text x="12" y="25" fill="#c07b1d" font-size="20">⌖</text>
      <text x="12" y="73" fill="#181410" font-size="12" font-weight="700">Ask for</text><text x="12" y="88" fill="#181410" font-size="12" font-weight="700">directions</text>
      <text x="12" y="102" fill="#8b867e" font-size="9">A1 · 5 steps</text>
    </g>
    <g transform="translate(141 568)">
      <rect width="108" height="108" rx="17" fill="#ffffff" stroke="#ddd8d0"/>
      <text x="12" y="25" fill="#c07b1d" font-size="20">◷</text>
      <text x="12" y="73" fill="#181410" font-size="12" font-weight="700">My daily</text><text x="12" y="88" fill="#181410" font-size="12" font-weight="700">routine</text>
      <text x="12" y="102" fill="#8b867e" font-size="9">A1 · 5 steps</text>
    </g>
    <g transform="translate(262 568)">
      <rect width="108" height="108" rx="17" fill="#ffffff" stroke="#ddd8d0"/>
      <text x="12" y="25" fill="#c07b1d" font-size="20">✦</text>
      <text x="12" y="73" fill="#181410" font-size="12" font-weight="700">Weekend</text><text x="12" y="88" fill="#181410" font-size="12" font-weight="700">plans</text>
      <text x="12" y="102" fill="#8b867e" font-size="9">A1 · 5 steps</text>
    </g>
    <rect x="20" y="706" width="350" height="58" rx="17" fill="#ffffff" stroke="#ddd8d0"/>
    <text x="40" y="732" fill="#c07b1d" font-size="19">✦</text>
    <text x="70" y="731" fill="#181410" font-size="13" font-weight="700">Generate another A1 lesson</text>
    <text x="70" y="749" fill="#8b867e" font-size="10">Uses your goals, level, and recent corrections.</text>
    <text x="348" y="740" fill="#c07b1d" font-size="20">›</text>
