<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Guided writing Apple-quality sentence tray</title>
  <desc id="desc">Light-mode guided writing screen with a dynamic left-aligned sentence tray, tutor call action, translation state, and loading states for audio and hint.</desc>
  <rect width="1200" height="900" fill="#ece8df"/>
  <text x="48" y="42" fill="#181410" font-family="Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="1.2">GUIDED WRITING · REBUILT</text>
  <text x="1152" y="42" text-anchor="end" fill="#8b867e" font-family="Arial, sans-serif" font-size="14">Flat tray · dynamic height · cached audio</text>

  <!-- Main screen -->
  <g transform="translate(45 70)">
    <rect width="500" height="780" rx="30" fill="#f9f7f1" stroke="#d9d2c7" stroke-width="2"/>
    <text x="24" y="38" fill="#181410" font-family="Arial, sans-serif" font-size="18">×</text>
    <text x="250" y="38" text-anchor="middle" fill="#181410" font-family="Arial, sans-serif" font-size="17" font-weight="700">Ask for help</text>
    <text x="470" y="38" text-anchor="end" fill="#181410" font-family="Arial, sans-serif" font-size="13" font-weight="700">2 of 5</text>
    <rect x="24" y="54" width="452" height="6" rx="3" fill="#e3ded4"/>
    <rect x="24" y="54" width="181" height="6" rx="3" fill="#c07b1d"/>

    <text x="24" y="102" fill="#c07b1d" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">GUIDED</text>
    <text x="24" y="150" fill="#181410" font-family="Arial, sans-serif" font-size="33" font-weight="700">Build the sentence</text>
    <circle cx="440" cy="141" r="19" fill="#fff0ce" stroke="#c07b1d"/>
    <text x="440" y="147" text-anchor="middle" fill="#c07b1d" font-family="Arial, sans-serif" font-size="17">☎</text>
    <circle cx="478" cy="141" r="19" fill="#fff0ce" stroke="#c07b1d"/>
    <text x="478" y="147" text-anchor="middle" fill="#c07b1d" font-family="Arial, sans-serif" font-size="16">♩</text>
    <text x="24" y="232" fill="#8b867e" font-family="Arial, sans-serif" font-size="16">Thank you very much for your help.</text>

    <rect x="24" y="346" width="110" height="42" rx="15" fill="#fff0ce"/>
    <rect x="144" y="346" width="55" height="42" rx="15" fill="#fff0ce"/>
    <rect x="209" y="346" width="104" height="42" rx="15" fill="#fff0ce"/>
    <text x="79" y="372" text-anchor="middle" fill="#181410" font-family="Arial, sans-serif" font-size="15" font-weight="700">Merci</text>
    <text x="171" y="372" text-anchor="middle" fill="#181410" font-family="Arial, sans-serif" font-size="15" font-weight="700">pour</text>
    <text x="261" y="372" text-anchor="middle" fill="#181410" font-family="Arial, sans-serif" font-size="15" font-weight="700">votre</text>
    <circle cx="453" cy="367" r="13" fill="none" stroke="#c07b1d" stroke-width="2" stroke-dasharray="5 3"/>
    <text x="453" y="372" text-anchor="middle" fill="#c07b1d" font-family="Arial, sans-serif" font-size="13">◖</text>

    <text x="24" y="430" fill="#c07b1d" font-family="Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="2">WORD BANK</text>
    <g font-family="Arial, sans-serif">
      <rect x="24" y="446" width="110" height="58" rx="15" fill="#ffffff" stroke="#ddd8d0"/>
      <text x="79" y="470" text-anchor="middle" fill="#181410" font-size="14" font-weight="700">beaucoup</text><text x="79" y="490" text-anchor="middle" fill="#8b867e" font-size="11">(a lot)</text>
      <rect x="144" y="446" width="70" height="58" rx="15" fill="#ffffff" stroke="#ddd8d0"/>
      <text x="179" y="470" text-anchor="middle" fill="#181410" font-size="14" font-weight="700">de</text><text x="179" y="490" text-anchor="middle" fill="#8b867e" font-size="11">(of)</text>
      <rect x="224" y="446" width="105" height="58" rx="15" fill="#ffffff" stroke="#ddd8d0"/>
      <text x="276" y="470" text-anchor="middle" fill="#181410" font-size="14" font-weight="700">Merci</text><text x="276" y="490" text-anchor="middle" fill="#8b867e" font-size="11">(thank you)</text>
      <rect x="339" y="446" width="137" height="58" rx="15" fill="#ffffff" stroke="#ddd8d0"/>
      <text x="408" y="470" text-anchor="middle" fill="#181410" font-size="14" font-weight="700">aide.</text><text x="408" y="490" text-anchor="middle" fill="#8b867e" font-size="11">(help)</text>
    </g>
    <text x="24" y="535" fill="#8b867e" font-family="Arial, sans-serif" font-size="13">Shuffled every step · answer chips stay French-only</text>
    <rect x="24" y="568" width="140" height="44" rx="22" fill="#ffffff" stroke="#ddd8d0"/>
    <text x="94" y="595" text-anchor="middle" fill="#181410" font-family="Arial, sans-serif" font-size="13" font-weight="700">◖  Listen</text>
    <rect x="172" y="568" width="140" height="44" rx="22" fill="#ffffff" stroke="#ddd8d0"/>
    <text x="242" y="595" text-anchor="middle" fill="#181410" font-family="Arial, sans-serif" font-size="13" font-weight="700">♧  Hint</text>
    <rect x="320" y="568" width="156" height="44" rx="22" fill="#fff0ce" stroke="#c07b1d"/>
    <text x="398" y="595" text-anchor="middle" fill="#c07b1d" font-family="Arial, sans-serif" font-size="13" font-weight="700">文A  Translate</text>

    <rect x="24" y="676" width="452" height="44" rx="15" fill="#c07b1d"/>
    <text x="250" y="703" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="700">Check sentence</text>
  </g>

  <!-- State notes -->
  <g transform="translate(595 93)">
    <text x="0" y="0" fill="#181410" font-family="Arial, sans-serif" font-size="18" font-weight="700">Interaction states</text>
    <text x="0" y="34" fill="#8b867e" font-family="Arial, sans-serif" font-size="14">The tray has no fixed card height. It expands only as chips wrap.</text>
    <rect x="0" y="70" width="540" height="114" rx="20" fill="#f9f7f1" stroke="#d9d2c7"/>
    <text x="22" y="100" fill="#c07b1d" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">AUDIO LOADING</text>
    <circle cx="45" cy="141" r="15" fill="none" stroke="#c07b1d" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="45" y="146" text-anchor="middle" fill="#c07b1d" font-family="Arial, sans-serif" font-size="13">◖</text>
    <text x="78" y="147" fill="#181410" font-family="Arial, sans-serif" font-size="14">Spinner wraps the speaker; cached playback clears it immediately.</text>

    <rect x="0" y="210" width="540" height="142" rx="20" fill="#f9f7f1" stroke="#d9d2c7"/>
    <text x="22" y="240" fill="#c07b1d" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">DYNAMIC HINT</text>
    <rect x="22" y="258" width="496" height="70" rx="15" fill="#fff0ce"/>
    <text x="42" y="286" fill="#181410" font-family="Arial, sans-serif" font-size="14">Look at the short word that comes before “votre”.</text>
    <text x="42" y="309" fill="#8b867e" font-family="Arial, sans-serif" font-size="12">Generated from the current prompt and selected draft; never reveals the answer.</text>

    <rect x="0" y="378" width="540" height="176" rx="20" fill="#f9f7f1" stroke="#d9d2c7"/>
    <text x="22" y="408" fill="#c07b1d" font-family="Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">QUALITY RULES</text>
    <text x="22" y="440" fill="#181410" font-family="Arial, sans-serif" font-size="14">• Left-align the sentence and word bank.</text>
    <text x="22" y="467" fill="#181410" font-family="Arial, sans-serif" font-size="14">• Keep translations beneath bank chips only.</text>
    <text x="22" y="494" fill="#181410" font-family="Arial, sans-serif" font-size="14">• Cache every lesson line as soon as the screen opens.</text>
    <text x="22" y="521" fill="#181410" font-family="Arial, sans-serif" font-size="14">• Dark mode uses the same structure and existing tokens.</text>
  </g>
</svg>
