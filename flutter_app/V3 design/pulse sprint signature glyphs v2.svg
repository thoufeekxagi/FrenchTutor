  <text x="48" y="58" fill="#F4F1EA" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="32" font-weight="700">ParleSprint · signature glyphs</text>
  <text x="50" y="90" fill="#8E8C88" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16">No literal feature icons · no wordmark · one memorable silhouette per direction</text>

